<!doctype html>
<html lang="ja" class="dark" data-color-theme="sky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEiN — リアルタイム地震情報・緊急地震速報</title>
    <meta name="description" content="リアルタイム地震情報・緊急地震速報・気象情報モニタリングサイト NEiN。P2P地震情報APIや気象庁データから最新の地震履歴・天気予報・警報を取得し、緊急地震速報を即時警告表示します。" />
    <meta property="og:title" content="NEiN — リアルタイム地震情報・緊急地震速報" />
    <meta property="og:description" content="リアルタイム地震情報・緊急地震速報・気象情報モニタリングサイト NEiN。地震履歴の検索・ワンクリックコピー・PDF出力・緊急地震速報アラートに対応。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('nein_theme_mode');
          var color = localStorage.getItem('nein_color_theme');
          var root = document.documentElement;
          if (mode === 'light') {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          } else {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
          if (color && ['sky', 'emerald', 'indigo', 'amber', 'slate'].indexOf(color) !== -1) {
            root.setAttribute('data-color-theme', color);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-sky-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
