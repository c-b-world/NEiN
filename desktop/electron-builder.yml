appId: jp.idio.nein.desktop
productName: NEiN防災
copyright: Copyright © 2026 IDIO
directories:
  output: release
files:
  - dist/**/*
  - desktop/main.cjs
asar: true
win:
  executableName: NEiN
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  unicode: true
  artifactName: NEiN-Setup-${version}-${arch}.${ext}
portable:
  artifactName: NEiN-Portable-${version}-${arch}.${ext}

