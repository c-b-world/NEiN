appId: jp.idio.nein.desktop
productName: NEiN防災
copyright: Copyright © 2026 IDIO
directories:
  output: release
files:
  - dist/**/*
  - desktop/main.cjs
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
artifactName: ${productName}-${version}-${arch}.${ext}
